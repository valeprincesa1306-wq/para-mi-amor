<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para mi amor ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #fff0f5, #ffe1eb, #fff8fb);
      color: #7b354f;
      text-align: center;
      padding: 25px 15px;
    }

    .contenedor {
      max-width: 600px;
      margin: 0 auto;
      padding: 25px 18px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid #f7cbd9;
      border-radius: 25px;
      box-shadow: 0 8px 30px rgba(160, 75, 110, 0.12);
    }

    .corazon {
      font-size: 35px;
      margin-bottom: 5px;
    }

    h1 {
      font-size: 30px;
      margin: 10px 0;
      color: #b34d73;
    }

    .subtitulo {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .foto-marco {
      width: 100%;
      height: 420px;
      background: #fff5f8;
      border: 1px solid #f4d1de;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #foto {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .contador {
      margin: 15px 0;
      font-size: 14px;
      color: #a45a77;
    }

    .botones {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 12px 22px;
      background: #d9789b;
      color: white;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #bd5d83;
      transform: translateY(-2px);
    }

    .mensaje {
      font-size: 16px;
      line-height: 1.8;
      margin-top: 25px;
    }

    .final {
      margin-top: 25px;
      font-size: 20px;
      color: #b34d73;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 10px;
      }

      .contenedor {
        padding: 22px 12px;
      }

      h1 {
        font-size: 26px;
      }

      .foto-marco {
        height: 350px;
      }

      button {
        padding: 11px 18px;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <div class="corazon">♡</div>

    <h1>Para mi amor</h1>

    <p class="subtitulo">
      Un pedacito de nosotros, aunque estemos lejos ❤️
    </p>

    <div class="foto-marco">
      <img id="foto" src="" alt="Un recuerdo nuestro">
    </div>

    <p class="contador" id="contador"></p>

    <div class="botones">
      <button onclick="anterior()">♡ Anterior</button>
      <button onclick="siguiente()">Siguiente ♡</button>
    </div>

    <div class="mensaje">
      Cada foto guarda algo bonito de nosotros.
      <br>
      Y aunque estemos lejos, siempre hay recuerdos
      que me hacen sentirte cerquita.
    </div>

    <div class="final">
      Te quiero muchísimo ❤️
    </div>

  </main>

  <script>
const fotos = [
  "1 .jpeg",
  "2.jpeg",
  "3.jpeg",
  "4.jpeg",
  "5.jpeg",
  "6.jpeg",
  "7.jpeg",
  "8.jpeg",
  "9.jpeg",
  "10.jpeg",
  "11.jpeg",
  "12.jpeg",
  "13.jpeg",
  "14.jpeg",
  "15.jpeg",
  "16.jpeg",
  "17.jpeg",
  "18.jpeg",
  "19.jpeg",
  "20.jpeg",
  "21.jpeg",
  "22.jpeg",
  "23.jpeg",
  "24.jpeg",
  "25.jpeg",
  "26.jpeg",
  "27.jpeg",
  "28.jpeg",
  "29.jpeg",
  "30.jpeg",
  "31.jpeg",
  "32.jpeg",
  "33.jpeg"
];

    let actual = 0;

    const imagen = document.getElementById("foto");
    const contador = document.getElementById("contador");

    function mostrarFoto() {
      imagen.src = fotos[actual];

      contador.textContent =
        "Recuerdo " + (actual + 1) + " de " + fotos.length;
    }

    function siguiente() {
      actual++;

      if (actual >= fotos.length) {
        actual = 0;
      }

      mostrarFoto();
    }

    function anterior() {
      actual--;

      if (actual < 0) {
        actual = fotos.length - 1;
      }

      mostrarFoto();
    }

    mostrarFoto();
  </script>

</body>
</html>
